[package]
name = "extramile-admin"
version = "0.0.0"
description = "ExtraMile Electronics back-office"
edition = "2021"
rust-version = "1.77"

[lib]
name = "extramile_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows Credential Manager backend (docs/07 §5). Adjust the feature per target OS.
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
# Bundled SQLite (no system dependency) for the offline cache + outbox (docs/07 §7).
rusqlite = { version = "0.32", features = ["bundled"] }
# PIN vault: the Supabase refresh token is sealed at rest with an AES-256-GCM key
# derived from the 6-digit PIN via Argon2id (docs/07 §5). No OAuth in the binary.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
